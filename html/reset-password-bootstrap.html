<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SAKURABLOG | Restablecer Contraseña</title>
    <meta name="theme-color" content="#0a0614"/>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="../css/style.css" rel="stylesheet"/>
</head>
<body class="ab-body-auth">

<header class="navbar navbar-expand-md navbar-dark sakura-topnav fixed-top">
    <div class="container-xxl px-3">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index-bootstrap.html">
            <img src="../img/logo_sakurablog.png" alt="Logo" style="height: 28px; width: auto;">
            <span class="sakura-brand fs-4 m-0 text-white">SAKURABLOG</span>
        </a>
        <a href="login-bootstrap.html" class="btn btn-link text-decoration-none d-flex align-items-center gap-1 sakura-muted small text-uppercase" style="letter-spacing:0.14em; font-size:10px;">
            <span class="material-symbols-outlined text-white" style="font-size:20px;">arrow_back</span>
            Volver al login
        </a>
    </div>
</header>

<main class="ab-auth-main">
    <div class="container-fluid px-0 min-vh-100">
        <div class="row g-0 min-vh-100">
            <section class="col-lg-7 d-none d-lg-flex position-relative align-items-center justify-content-center p-5 overflow-hidden">
                <div class="position-absolute top-0 start-0 w-100 h-100">
                    <img alt="Paisaje anime" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUlTqbNIloEHS87RpYo6Vhx5V_nJNqtsQbOHhTDLRLR3RwdyKTjD_0I_tFartRUkk3t7R3vpXF5eYNtNDznuUK1yqQMNmnDjh9PYW-OblN4sCm2pImSakmijGAdTq30MUJgiMCYT9XWabtwiW8CLGuydhibeo3pQYzUlxVNmYRpflr2bfP0vVmClhmEhz8AGYtPAZeaqGLIEjy1HlP57jbjT9yNtz5O2fcMvUkxa-3dsLn2JqD5IS7LxTuHMKKTw1dGOUH0egt1g" class="w-100 h-100 object-fit-cover" style="filter: brightness(0.6);"/>
                    <div class="position-absolute top-0 start-0 w-100 h-100" style="background:linear-gradient(100deg, rgba(10,6,20,.98) 0%, rgba(18,10,35,.55) 55%, rgba(10,6,20,.12) 100%);"></div>
                </div>
                <div class="position-relative ab-glass-blurb p-5" style="max-width:760px;">
                    <h1 class="font-headline fw-black text-white display-6 mb-2" style="font-weight:900;">SAKURABLOG</h1>
                    <div class="ab-editorial-bar mb-4"></div>
                    <p class="font-headline sakura-muted fs-3 lh-sm mb-4" style="letter-spacing:-0.02em;">
                        Sistema de actualización de credenciales seguro.
                    </p>
                    <div class="d-flex align-items-center gap-3">
                        <div style="height:1px;width:32px;background:var(--accent);opacity:.85;"></div>
                        <span class="ab-label-micro" style="color:var(--accent);">Issue #84 · The Renaissance</span>
                    </div>
                </div>
            </section>

            <section class="col-12 col-lg-5 d-flex align-items-center justify-content-center ab-form-side px-4 py-5">
                <div class="w-100" style="max-width:420px;">
                    <div class="d-lg-none mb-4">
                        <h1 class="font-headline text-white m-0" style="font-weight:900;letter-spacing:-0.02em;">SAKURABLOG</h1>
                        <div class="ab-editorial-bar mt-2" style="width:72px;"></div>
                    </div>
                    <div class="mb-4">
                        <h2 class="font-headline text-white mb-2" style="font-weight:900;letter-spacing:-0.02em;">Crear contraseña</h2>
                        <p class="mb-0 sakura-muted">Establece tu nueva contraseña de acceso.</p>
                    </div>

                    <form id="resetPasswordForm" class="mb-4">
                        <div class="mb-4">
                            <label for="password" class="ab-label-micro mb-2 d-block" style="color:var(--muted);">Nueva contraseña</label>
                            <div class="position-relative">
                                <input id="password" type="password" class="form-control ab-line-input pe-5" placeholder="•••••••••" required minlength="6"/>
                                <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none sakura-muted p-0 me-1 toggle-password" data-target="#password">
                                    <span class="material-symbols-outlined fs-5">visibility</span>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="ab-label-micro mb-2 d-block" style="color:var(--muted);">Confirmar contraseña</label>
                            <div class="position-relative">
                                <input id="confirmPassword" type="password" class="form-control ab-line-input pe-5" placeholder="•••••••••" required minlength="6"/>
                                <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none sakura-muted p-0 me-1 toggle-password" data-target="#confirmPassword">
                                    <span class="material-symbols-outlined fs-5">visibility</span>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="w-100 btn sakura-primary-btn py-3"><span>Actualizar Contraseña</span></button>
                    </form>

                </div>
            </section>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/script.js"></script>

<script>
    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            $('<div class="alert alert-danger mb-4" style="font-size:0.85em; border-radius:0; background: rgba(220, 53, 69, 0.1); border: 1px solid rgba(220, 53, 69, 0.3); color: #ff8a8a;">Enlace inválido o expirado.</div>').prependTo('#resetPasswordForm');
            $('#resetPasswordForm button, #resetPasswordForm input').prop('disabled', true);
        }

        // Toggle password visibility
        $('.toggle-password').on('click', function() {
            const targetId = $(this).data('target');
            const $input = $(targetId);
            const $icon = $(this).find('.material-symbols-outlined');
            
            if ($input.attr('type') === 'password') {
                $input.attr('type', 'text');
                $icon.text('visibility_off');
            } else {
                $input.attr('type', 'password');
                $icon.text('visibility');
            }
        });

        $('#resetPasswordForm').on('submit', function(e) {
            e.preventDefault();
            const password = $('#password').val();
            const confirmPassword = $('#confirmPassword').val();
            
            $('.custom-alert-msg').remove();

            if (password !== confirmPassword) {
                $('<div class="alert alert-danger custom-alert-msg mt-3" style="font-size:0.85em; border-radius:0; background: rgba(220, 53, 69, 0.1); border: 1px solid rgba(220, 53, 69, 0.3); color: #ff8a8a;">Las contraseñas no coinciden.</div>').insertAfter('#resetPasswordForm');
                return;
            }

            const $btn = $(this).find('button');
            const originalText = $btn.html();
            $btn.prop('disabled', true).text('Guardando...');

            $.ajax({
                url: '/api/auth/reset-password',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ token: token, email: email, newPassword: password }),
                success: function(res) {
                    $('<div class="alert alert-success custom-alert-msg mt-3" style="font-size:0.85em; border-radius:0; background: rgba(25, 135, 84, 0.1); border: 1px solid rgba(25, 135, 84, 0.3); color: #d1e7dd;">'+res.message + '. Redirigiendo...</div>').insertAfter('#resetPasswordForm');
                    $btn.html('<span>Actualizado</span>');
                    setTimeout(() => {
                        window.location.href = 'login-bootstrap.html';
                    }, 2000);
                },
                error: function(err) {
                    const msg = err.responseJSON && err.responseJSON.message ? err.responseJSON.message : 'Error al actualizar contrase\u00f1a';
                    $('<div class="alert alert-danger custom-alert-msg mt-3" style="font-size:0.85em; border-radius:0; background: rgba(220, 53, 69, 0.1); border: 1px solid rgba(220, 53, 69, 0.3); color: #ff8a8a;">'+msg+'</div>').insertAfter('#resetPasswordForm');
                    $btn.prop('disabled', false).html(originalText);
                }
            });
        });
    });
</script>

</body>
</html>
